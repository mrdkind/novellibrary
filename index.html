    <!-- SEO-001 — متادیتای اشتراک‌گذاری (Open Graph / Twitter) و آدرس کانونیکال -->
    <link rel="canonical" href="https://mrdkind.github.io/novellibrary/" />

    <script>
      // اعمال تم ذخیره‌شده قبل از اولین رندر برای جلوگیری از پرش رنگ
      (function () {
        try {
          var t = localStorage.getItem('ns-site-theme');
          if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
          else document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <noscript>برای استفاده از روایت بی‌پایان باید جاوااسکریپت مرورگر فعال باشد.</noscript>

  </body>
